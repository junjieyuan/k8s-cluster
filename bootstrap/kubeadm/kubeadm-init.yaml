apiVersion: kubeadm.k8s.io/v1beta4
kind: InitConfiguration
nodeRegistration:
  criSocket: unix:///var/run/crio/crio.sock
  kubeletExtraArgs:
    - name: "volume-plugin-dir"
      value: "/var/lib/kubelet/volumeplugins"
---
apiVersion: kubeadm.k8s.io/v1beta4
kind: ClusterConfiguration
# This file is a template: ${CONTROL_PLANE_ENDPOINT} is substituted at runtime by init-control-plane.sh.
# Default: control-plane.k8s.junjie.pro:6443 (override with --endpoint).
controlPlaneEndpoint: "${CONTROL_PLANE_ENDPOINT}"
networking:
  # Must match the CIDR passed to the Cilium install script.
  podSubnet: "172.16.0.0/12"
  serviceSubnet: "10.96.0.0/12"
controllerManager:
  extraArgs:
    - name: "flex-volume-plugin-dir"
      value: "/var/lib/kubelet/volumeplugins"
