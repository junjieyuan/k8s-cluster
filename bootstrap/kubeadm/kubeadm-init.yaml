---
{
  apiVersion: "kubeadm.k8s.io/v1beta4",
  kind: "InitConfiguration",
  # Cilium's eBPF datapath replaces the kube-proxy addon; installing it as well
  # would put a second NAT implementation on every node, unaware of Cilium's.
  skipPhases: [
    "addon/kube-proxy",
  ],
  nodeRegistration: {
    criSocket: "unix:///var/run/crio/crio.sock",
    kubeletExtraArgs: [{
      name: "volume-plugin-dir",
      value: "/var/lib/kubelet/volumeplugins",
    }],
  },
}
---
# Must stay: kubeadm parses any document starting with "{" as JSON, and
# KYAML's unquoted keys are not valid JSON.
{
  apiVersion: "kubeadm.k8s.io/v1beta4",
  kind: "ClusterConfiguration",
  controlPlaneEndpoint: "${CONTROL_PLANE_ENDPOINT}", # substituted at runtime; default: control-plane.k8s.junjie.pro:6443
  networking: {
    podSubnet: "${POD_CIDR}", # must match ipam.operator.clusterPoolIPv4PodCIDRList (infrastructure/cilium/values.yaml)
    serviceSubnet: "10.96.0.0/12",
  },
  controllerManager: {
    extraArgs: [{
      name: "flex-volume-plugin-dir",
      value: "/var/lib/kubelet/volumeplugins",
    }],
  },
}
