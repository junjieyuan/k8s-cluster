---
{
  apiVersion: "kubeadm.k8s.io/v1beta4",
  kind: "JoinConfiguration",
  discovery: {
    bootstrapToken: {
      apiServerEndpoint: "${ENDPOINT}",
      token: "${TOKEN}",
      caCertHashes: [
        "${HASH}",
      ],
    },
  },
  nodeRegistration: {
    criSocket: "unix:///var/run/crio/crio.sock",
    kubeletExtraArgs: [{
      name: "volume-plugin-dir",
      value: "/var/lib/kubelet/volumeplugins",
    }],
  },
}
