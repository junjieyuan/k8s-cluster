---
{
  gatewayAPI: {
    enabled: true,
  },
  # The chart's default "helm" method re-generates the CA and the Hubble
  # certificates on every apply: its lookup-based reuse cannot work under
  # `helm template`. See docs/cilium-gateway.md.
  hubble: {
    tls: {
      auto: {
        method: "certmanager",
        certManagerIssuerRef: {
          group: "cert-manager.io",
          kind: "ClusterIssuer",
          name: "internal-ca",
        },
      },
    },
  },
  ipam: {
    operator: {
      clusterPoolIPv4PodCIDRList: [
        "172.16.0.0/12",
      ],
    },
  },
  # The `kubernetes` ClusterIP is unreachable before an agent runs (kube-proxy
  # replacement); see "API server access" in docs/cilium-gateway.md.
  k8sServiceHost: "control-plane.k8s.junjie.pro",
  k8sServicePort: "6443",
  kubeProxyReplacement: true,
  l2announcements: {
    enabled: true,
  },
}
