---
{
  apiVersion: "kustomize.config.k8s.io/v1beta1",
  kind: "Kustomization",
  namespace: "cert-manager",
  helmCharts: [{
    name: "cert-manager",
    repo: "oci://quay.io/jetstack/charts",
    version: "v1.21.1",
    releaseName: "cert-manager",
    valuesFile: "values.yaml",
  }],
  generatorOptions: {
    disableNameSuffixHash: true,
  },
  resources: [
    "namespace.yaml",
    "clusterissuer.yaml",
  ],
  secretGenerator: [{
    name: "cloudflare-api-token",
    envs: [
      ".env",
    ],
  }],
}
