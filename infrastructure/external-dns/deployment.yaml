apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: external-dns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: external-dns
  template:
    metadata:
      labels:
        app: external-dns
    spec:
      serviceAccountName: external-dns
      containers:
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:${VERSION}
          args:
            - --provider=cloudflare
            - --source=gateway-httproute
            - --source=gateway-grpcroute
            - --domain-filter=${DOMAIN_FILTER}
            - --policy=sync
            - --registry=txt
            - --txt-owner-id=k8s-gw-junjie
            - --interval=5m
            - --log-level=info
          env:
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-api-token
                  key: api-token
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      securityContext:
        fsGroup: 65534
