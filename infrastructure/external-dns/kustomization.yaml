apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: external-dns

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - clusterrole.yaml
  - clusterrolebinding.yaml
  - deployment.yaml

images:
  - name: registry.k8s.io/external-dns/external-dns
    newTag: "v0.21.0"

secretGenerator:
  - name: cloudflare-api-token
    envs:
      - .env
