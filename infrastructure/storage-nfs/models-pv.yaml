apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-models
  labels:
    type: nfs-models
spec:
  capacity:
    # NFS PVs have no actual quota enforcement — this is informational only.
    # The real limit is the NFS server's underlying disk space.
    storage: 10Ti
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  mountOptions:
    - nfsvers=4.2
    - hard
    - ro
    - rsize=1048576
    - timeo=600
    - retrans=2
  nfs:
    server: ${NFS_SERVER}
    path: /models
    readOnly: true
